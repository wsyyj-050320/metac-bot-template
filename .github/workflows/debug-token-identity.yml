name: Debug - identify token account (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Who am I
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          tok = os.environ["METACULUS_TOKEN"]
          UA = {"Authorization": "Token " + tok, "Content-Type": "application/json", "Accept": "application/json"}
          # 1) list models
          try:
              r = urllib.request.urlopen(urllib.request.Request(
                  "https://llm-proxy.metaculus.com/proxy/openai/v1/models", headers=UA), timeout=40)
              d = json.loads(r.read().decode())
              print("MODELS:", json.dumps([m.get("id") for m in d.get("data", [])]))
          except urllib.error.HTTPError as e:
              print("MODELS HTTP", e.code, e.read()[:200].decode("utf-8","replace"))
          # 2) tiny completion per candidate model
          for model in ("gpt-4o-mini", "gpt-4o", "gpt-4o-search-preview", "claude-3-5-sonnet-20241022", "gemini-2.5-flash"):
              body = json.dumps({"model": model, "messages": [{"role": "user", "content": "say ok"}], "max_tokens": 5}).encode()
              req = urllib.request.Request(
                  "https://llm-proxy.metaculus.com/proxy/openai/v1/chat/completions",
                  data=body, headers=UA, method="POST")
              try:
                  r = urllib.request.urlopen(req, timeout=60)
                  d = json.loads(r.read().decode())
                  print(model, "-> OK:", (d.get("choices") or [{}])[0].get("message", {}).get("content", "")[:30])
              except urllib.error.HTTPError as e:
                  print(model, "-> HTTP", e.code, e.read()[:180].decode("utf-8","replace"))
              except Exception as e:
                  print(model, "-> ERR", type(e).__name__, str(e)[:120])
          PY
