name: Debug - identify token account (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Who am I
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python - <<'PY'
          import os, urllib.request, json
          tok = os.environ["METACULUS_TOKEN"]
          UA = {"Authorization": "Token " + tok,
                "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept": "application/json"}
          req = urllib.request.Request(
              "https://www.metaculus.com/api/auth/me/",
              headers=UA,
          )
          d = json.load(urllib.request.urlopen(req, timeout=30))
          keep = {k: d.get(k) for k in ("id", "username", "is_bot", "user_type", "date_joined") if k in d}
          print("ACCOUNT:", json.dumps(keep))
          # list my forecasting bots
          for ep in ("/users/me/", "/users/me/bots/"):
              try:
                  r2 = urllib.request.Request(
                      "https://www.metaculus.com" + ep,
                      headers=UA,
                  )
                  d2 = json.load(urllib.request.urlopen(r2, timeout=30))
                  print("BOTS", ep, ":", json.dumps(d2)[:1500])
              except Exception as e:
                  print("BOTS", ep, "->", type(e).__name__, getattr(e, "code", ""))
          PY
