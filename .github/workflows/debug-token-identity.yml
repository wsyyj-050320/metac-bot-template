name: Debug - identify token account (one-off, delete after use)

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Who am I
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error, json
          tok = os.environ["METACULUS_TOKEN"]
          UA = {"Authorization": "Token " + tok,
                "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept": "application/json"}
          for ep in ("/users/me/", "/users/me/bots/", "/auth/me/", "/me/",
                     "/questions/?tournament=33121&limit=3&status=open"):
              url = "https://www.metaculus.com/api" + ep
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30)
                  body = r.read().decode("utf-8", "replace")
                  print("OK", ep, "->", body[:1200].replace("\n", " "))
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, ep, "->", e.read()[:200].decode("utf-8", "replace").replace("\n", " "))
              except Exception as e:
                  print("ERR", ep, "->", type(e).__name__, str(e)[:120])
          PY
